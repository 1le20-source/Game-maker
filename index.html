<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Serenity Hands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141a1c; --panel:#1d2629; --panel2:#243034; --line:#33444a;
  --text:#eef3f1; --muted:#9fb2ae; --gold:#e8c37a; --teal:#4fc1a6;
  --pink:#f08bb0; --red:#e86a5f; --green:#6fd08c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%}
#topbar{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:800;color:var(--gold);letter-spacing:.5px;margin-right:auto}
.stat{background:var(--panel2);padding:4px 10px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}
#timeWrap{display:flex;align-items:center;gap:8px;min-width:200px}
#timeBar{flex:1;height:8px;background:#0e1314;border-radius:6px;overflow:hidden;min-width:100px}
#timeFill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .2s}
#timeFill.over{background:var(--red)}
#main{flex:1;display:flex;min-height:0}
#side{width:270px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:12px;overflow-y:auto}
#portrait{width:100%;max-width:200px;aspect-ratio:1;display:block;margin:0 auto 8px;border-radius:16px;border:2px solid var(--line);background:#222}
.cname{font-size:20px;font-weight:800;text-align:center}
.pron{font-size:13px;color:var(--muted);font-weight:600}
.tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.req{font-style:italic;color:#d6e2df;font-size:13.5px;background:#18201f;border-left:3px solid var(--gold);padding:6px 8px;border-radius:6px;margin:8px 0}
h4{margin:12px 0 6px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.meter{margin:6px 0}
.meter .lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.bar{height:10px;background:#0e1314;border-radius:6px;overflow:hidden;margin-top:3px}
.bar>div{height:100%;width:0;transition:width .15s}
#relaxFill{background:linear-gradient(90deg,#3aa58a,var(--green))}
#comfortFill{background:linear-gradient(90deg,#c0607f,var(--pink))}
.fz{display:flex;align-items:center;gap:6px;font-size:12.5px;margin:3px 0}
.fz span{width:96px}
.fz .bar{flex:1;margin:0;height:7px}
.fz .bar>div{background:linear-gradient(90deg,var(--red),var(--gold),var(--green))}
.know{font-size:13px;margin:3px 0;display:flex;justify-content:space-between;gap:6px}
.know b{color:var(--gold)}
.know .unk{color:#6e807c}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-width:0;background:#0d1112}
#game{display:block;touch-action:none;cursor:none;border-radius:6px}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(15,20,22,.92);border:1px solid var(--line);
  padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#toolbar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap;justify-content:center}
.grp{display:flex;gap:4px;align-items:center;background:#18201f;padding:4px;border-radius:12px}
.grp .gl{font-size:11px;color:var(--muted);padding:0 6px;text-transform:uppercase;letter-spacing:1px}
button{font-family:inherit;font-weight:700;font-size:14px;color:var(--text);background:var(--panel2);border:1px solid var(--line);
  padding:8px 12px;border-radius:10px;cursor:pointer;transition:background .15s,transform .05s;white-space:nowrap}
button:hover{background:#2e3d42}
button:active{transform:translateY(1px)}
button.on{background:var(--teal);color:#0d1a17;border-color:var(--teal)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--gold);color:#2a1f08;border-color:var(--gold)}
button.primary:hover{background:#f3d396}
button.danger{background:#5a2a2a;border-color:#7a3a3a}
kbd{font-size:10px;opacity:.6;margin-left:4px;font-family:inherit}
select{font-family:inherit;font-weight:700;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px}
#overlay{position:fixed;inset:0;background:rgba(5,8,9,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#overlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:620px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h1{margin:0 0 6px;color:var(--gold);font-size:30px}
.modal h2{margin:0 0 10px;color:var(--gold)}
.modal p{color:#d3dfdc;line-height:1.5}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;justify-content:center}
.intro{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.intro canvas{width:150px;height:150px;border-radius:14px;border:2px solid var(--line)}
.stars{font-size:34px;color:var(--gold);letter-spacing:2px;text-align:center}
.rows{margin:10px 0}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.row.total{font-weight:800;font-size:18px;border:none;color:var(--gold)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.item .t{font-weight:800}
.item .d{font-size:13px;color:var(--muted);flex:1}
.help li{margin:4px 0;color:#d3dfdc}
.stw{white-space:nowrap}.st{color:#4a5a5e}.st.full{color:var(--gold)}
.st.half{background:linear-gradient(90deg,var(--gold) 50%,#4a5a5e 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.quote{font-style:italic;text-align:center;color:#d6e2df;margin:8px 0}
@media (max-width:820px){
  #main{flex-direction:column}
  #side{width:100%;max-height:150px;display:grid;grid-template-columns:90px 1fr;gap:4px 10px;border-right:none;border-bottom:1px solid var(--line);padding:8px}
  #portrait{grid-row:span 6;width:90px;margin:0}
  .cname{text-align:left;font-size:16px}.tags{justify-content:flex-start}
  #side h4,#focusList,#knowList{display:none}
  .req{margin:2px 0;font-size:12px}
  button{padding:7px 9px;font-size:13px} kbd{display:none}
  .brand{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand">🌿 Serenity Hands</div>
    <div class="stat" id="moneyStat">💵 $0</div>
    <div class="stat" id="dayStat">Day 1 · Client 1/5</div>
    <div class="stat" id="repStat">⭐ 3.0</div>
    <div id="timeWrap"><span class="stat" id="timeTxt">0 / 60 min</span><div id="timeBar"><div id="timeFill"></div></div></div>
  </div>
  <div id="main">
    <aside id="side">
      <canvas id="portrait" width="320" height="320"></canvas>
      <div class="cname"><span id="cName">—</span> <span class="pron" id="cPron"></span></div>
      <div class="tags" id="cTags"></div>
      <div class="req" id="cReq">Waiting for a client…</div>
      <div class="meter"><div class="lbl"><span>😌 Relaxation</span><span id="relaxPct">0%</span></div><div class="bar"><div id="relaxFill"></div></div></div>
      <div class="meter"><div class="lbl"><span>💗 Comfort</span><span id="comfortPct">0%</span></div><div class="bar"><div id="comfortFill"></div></div></div>
      <h4>Focus areas</h4>
      <div id="focusList"></div>
      <h4>What you know</h4>
      <div id="knowList"></div>
    </aside>
    <div id="stage"><canvas id="game"></canvas><div id="toast"></div></div>
  </div>
  <div id="toolbar">
    <div class="grp"><span class="gl">Tool</span>
      <button id="tHands" class="on">✋ Hands<kbd>Q</kbd></button>
      <button id="tOil">💧 Oil<kbd>W</kbd></button>
      <select id="scentSel" title="Oil scent"></select>
      <button id="tStone">🪨 Hot Stones<kbd>R</kbd></button>
    </div>
    <div class="grp"><span class="gl">Pressure</span>
      <button id="p1">Light<kbd>1</kbd></button>
      <button id="p2" class="on">Medium<kbd>2</kbd></button>
      <button id="p3">Firm<kbd>3</kbd></button>
    </div>
    <div class="grp">
      <button id="bHeat">🔥 Tension view<kbd>T</kbd></button>
      <button id="bTalk">💬 Talk<kbd>C</kbd></button>
      <button id="bMusic">🎵 Music<kbd>M</kbd></button>
      <button id="bPause">⏸<kbd>Esc</kbd></button>
    </div>
    <button id="bEnd" class="primary">✔ End Session<kbd>E</kbd></button>
  </div>
</div>
<div id="overlay"><div class="modal" id="modal"></div></div>

<script>
'use strict';
/* =========================================================
   Serenity Hands — a 2D first-person massage therapist sim
   ========================================================= */

// ---------- Utilities ----------
const W = 1280, H = 720, CY = 380;
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function weighted(obj) { // {key: weight}
  const entries = Object.entries(obj); let t = 0;
  for (const [, w] of entries) t += w;
  let r = Math.random() * t;
  for (const [k, w] of entries) { r -= w; if (r <= 0) return k; }
  return entries[0][0];
}
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function shade(hex, amt) { // amt -1..1
  const [r, g, b] = hexToRgb(hex);
  const f = c => clamp(Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt), 0, 255);
  return '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, '0')).join('');
}
function rgba(hex, a) { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// ---------- Save data ----------
const SAVE_KEY = 'serenityHands_v1';
const DEFAULT_SAVE = () => ({ money: 120, day: 1, clientNo: 0, ratings: [], owned: {}, music: true,
  stats: { clients: 0, earned: 0, fiveStars: 0, knots: 0 }, dayLog: [], todayTotal: 4 });
let S = DEFAULT_SAVE();
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function loadGame() {
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY)); if (d && typeof d.money === 'number') { S = Object.assign(DEFAULT_SAVE(), d); return true; } } catch (e) {}
  return false;
}
function saveGame() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function rep() { if (!S.ratings.length) return 3; const r = S.ratings.slice(-20); return r.reduce((a, b) => a + b, 0) / r.length; }
function clientsToday() { const r = rep(); return 4 + (r >= 3.6 ? 1 : 0) + (r >= 4.4 ? 1 : 0) + (S.owned.decor ? 1 : 0); }
function todayTotal() { return S.todayTotal || clientsToday(); }
function dailyRent() { return Math.min(90, 40 + 5 * Math.floor((S.day - 1) / 3)); }

// ---------- Game data ----------
const SHOP = [
  { id: 'lavender', name: '💜 Lavender Oil', price: 60, desc: 'A calming floral scent. Some clients adore it.' },
  { id: 'citrus', name: '🍊 Sweet Orange Oil', price: 70, desc: 'Bright and uplifting. A favorite of energetic clients.' },
  { id: 'eucalyptus', name: '🌿 Eucalyptus Oil', price: 80, desc: 'Cooling and fresh. Athletes love it.' },
  { id: 'stones', name: '🪨 Hot Stone Set', price: 150, desc: 'Unlocks Hot Stones: place them on the back/shoulders to melt tension passively.' },
  { id: 'speakers', name: '🎶 Ambient Speakers', price: 140, desc: 'Music now actively builds comfort during sessions.' },
  { id: 'table', name: '🛏️ Memory-Foam Table', price: 220, desc: '+12 starting comfort for every client.' },
  { id: 'decor', name: '🏮 Zen Room Decor', price: 300, desc: 'Lanterns, plants & bamboo. +15% session prices and +1 client per day.' },
  { id: 'cert', name: '🎓 Advanced Certification', price: 600, desc: 'Your hands work 25% more effectively. +20% session prices.' },
];
const SCENTS = { unscented: 'Unscented', lavender: 'Lavender', citrus: 'Sweet Orange', eucalyptus: 'Eucalyptus' };
const SCENT_COLOR = { unscented: '#e9d9a8', lavender: '#b79be6', citrus: '#f2a65a', eucalyptus: '#86c9a3' };

const SKINS = ['#fde6d4', '#f8d5bd', '#f0c3a2', '#e3ab86', '#cf9168', '#b0734c', '#8f5a3a', '#6e432a'];
const HAIRS = { black: '#26252d', brown: '#4d3222', chestnut: '#7b4a2b', blonde: '#e9c96f', pink: '#f3a3c4', silver: '#cfd3dc',
  blue: '#5a7fd8', red: '#b8433a', purple: '#8d6bd4', teal: '#3db3a1', white: '#f1efe9' };
const EYES = ['#5a3a22', '#2f6fb5', '#3a9a6a', '#8a4fc0', '#c0473f', '#c99a2e', '#4a4a58', '#2aa3b0'];

const IDS = {
  woman:      { label: 'Woman', w: 40, pron: ['she/her'], subj: 'she',
    names: ['Sakura','Mia','Elena','Aiko','Chloe','Priya','Yuna','Sofia','Hana','Isabella','Rin','Amara','Leila','Nora','Mei','Zoe','Camila','Fatima','Ingrid','Mio','Valentina','Aaliyah','Emi','Grace'],
    hair: { long: 5, ponytail: 3, bob: 2, buns: 2, twintails: 1, short: 1 }, sw: [76, 88], ww: [48, 60], hw: [70, 86] },
  transwoman: { label: 'Trans woman', w: 13, pron: ['she/her'], subj: 'she',
    names: ['Luna','Aria','Jade','Kira','Vivian','Seraphina','Nova','Rei','Ivy','Mira','Celeste','Ophelia','Natsuki','Lyra'],
    hair: { long: 5, ponytail: 2, bob: 2, buns: 1, twintails: 1 }, sw: [80, 96], ww: [52, 64], hw: [66, 80] },
  femboy:     { label: 'Femboy', w: 16, pron: ['he/him', 'he/they'], subj: 'he',
    names: ['Felix','Ren','Kai','Asher','Nico','Yuki','Haru','Theo','Sora','Milo','Ezra','Aoi','Riku','Jules'],
    hair: { bob: 4, short: 3, ponytail: 2, long: 2, twintails: 1 }, sw: [74, 86], ww: [50, 60], hw: [62, 74] },
  transman:   { label: 'Trans man', w: 7, pron: ['he/him'], subj: 'he',
    names: ['Elliot','Rowan','Jasper','Silas','Kaito','Noah','Finn','Leo','Hiro'],
    hair: { short: 6, bob: 1, undercut: 3 }, sw: [82, 94], ww: [56, 68], hw: [64, 76] },
  man:        { label: 'Man', w: 10, pron: ['he/him'], subj: 'he',
    names: ['Daichi','Marcus','Kenji','Diego','Owen','Takeshi','Liam','Andre','Jun','Malik','Ivan','Sebastian'],
    hair: { short: 6, undercut: 3, ponytail: 1 }, sw: [90, 104], ww: [62, 76], hw: [64, 76] },
  nonbinary:  { label: 'Non-binary', w: 8, pron: ['they/them'], subj: 'they',
    names: ['Sky','River','Ash','Quinn','Rory','Sasha','Robin','Akira','Kit','Phoenix','Remy','Sage'],
    hair: { bob: 3, short: 3, undercut: 2, long: 2, buns: 1 }, sw: [76, 96], ww: [52, 68], hw: [62, 80] },
  genderfluid:{ label: 'Genderfluid', w: 6, pron: ['she/they', 'he/they'], subj: 'they',
    names: ['Alex','Jordan','Nao','Charlie','Max','Hikaru','Emery','Avery'],
    hair: { long: 2, bob: 2, twintails: 1, short: 2, ponytail: 2 }, sw: [76, 94], ww: [50, 66], hw: [64, 80] },
};

const ZONES = ['head','neck','shoulderT','shoulderB','upperBack','lowerBack','armT','armB','handT','handB','calfT','calfB','footT','footB'];
const ZLABEL = { head: 'Scalp', neck: 'Neck', shoulderT: 'Left shoulder', shoulderB: 'Right shoulder', upperBack: 'Upper back',
  lowerBack: 'Lower back', armT: 'Left arm', armB: 'Right arm', handT: 'Left hand', handB: 'Right hand',
  calfT: 'Left calf', calfB: 'Right calf', footT: 'Left foot', footB: 'Right foot' };
const NEEDS_OIL = new Set(['shoulderT','shoulderB','upperBack','lowerBack','armT','armB','calfT','calfB']);
const STONE_OK = new Set(['shoulderT','shoulderB','upperBack','lowerBack']);

const REQUESTS = [
  { text: "Desk job. My neck and shoulders are basically concrete.", focus: ['neck','shoulderT','shoulderB'], service: 'Deep Tissue', pref: 3 },
  { text: "My lower back has ached ever since I moved apartments.", focus: ['lowerBack','upperBack'], service: 'Therapeutic', pref: 2 },
  { text: "Leg day destroyed me. Please save my calves.", focus: ['calfT','calfB'], service: 'Sports', pref: 3 },
  { text: "I'm on my feet all day at the café. Feet and calves, please!", focus: ['footT','footB','calfT','calfB'], service: 'Reflexology', pref: 2 },
  { text: "I just want to melt. Full back, nice and slow.", focus: ['upperBack','lowerBack'], service: 'Swedish', pref: 1 },
  { text: "Exam season headaches… could you focus on my scalp and neck?", focus: ['head','neck'], service: 'Relaxation', pref: 1 },
  { text: "Gaming marathon. My forearms and hands hate me.", focus: ['armT','armB','handT','handB'], service: 'Therapeutic', pref: 2 },
  { text: "Went bouldering yesterday. Shoulders and upper back are fried.", focus: ['shoulderT','shoulderB','upperBack'], service: 'Sports', pref: 3 },
  { text: "Dance rehearsals all week. My legs and feet are done.", focus: ['calfT','calfB','footT','footB'], service: 'Sports', pref: 2 },
  { text: "Twelve-hour flight. Everything is stiff, especially my back.", focus: ['upperBack','lowerBack','neck'], service: 'Swedish', pref: 2 },
  { text: "I draw comics all day — my right arm and shoulder are aching.", focus: ['armB','handB','shoulderB'], service: 'Therapeutic', pref: 2 },
  { text: "Stressful week at work. I just want to feel human again.", focus: ['neck','upperBack','head'], service: 'Relaxation', pref: 1 },
];
const STONE_REQUEST = { text: "I booked the hot stone treatment — I've heard it's amazing!", focus: ['upperBack','lowerBack','shoulderT','shoulderB'], service: 'Hot Stone', pref: 2 };

const LINES = {
  greet: ["Hi! I'm all yours. Be gentle… or don't.", "Hello~ I've been looking forward to this all week.", "Hey there. Ready when you are.", "Hi! Sorry, I'm a little tense today.", "Okay, I'm comfy. Let's do this."],
  good: ["Mmm… that's nice.", "Oh wow… right there.", "I can feel it letting go…", "You have magic hands.", "This is exactly what I needed.", "Mmmhm…", "Ahh… so good."],
  zone: { head: "Scalp massages should be illegal, that's so good…", neck: "My neck is thanking you right now.", footT: "My feet… pure bliss.", footB: "My feet… pure bliss.",
    lowerBack: "Oh, my lower back needed that.", handT: "Ooh, I never knew hands could feel this good.", handB: "Ooh, I never knew hands could feel this good.",
    calfT: "Ahh, my poor calves…", calfB: "Ahh, my poor calves…", upperBack: "That's the spot… mmm." },
  knot: ["Oh! That knot just… melted.", "Ahh—yes, that one's been bugging me for weeks!", "Whoa… I felt that release.", "How did you find that? Amazing."],
  hard: p => [`Ow—a little lighter? ${p} pressure is my sweet spot.`, `Ouch… could you ease up? ${p} feels best.`],
  soft: p => [`You can press harder, I don't mind. ${p} is fine!`, `Feel free to go ${p.toLowerCase()}er—I can take it.`],
  dry: ["Could you use a little oil? It's a bit draggy.", "Ah, my skin's dry—some oil would help."],
  tickle: ["Pfft—haha! Sorry! My feet are ticklish!", "Hehe—stop—ticklish! Maybe firmer?"],
  hairOil: ["Ah—not in my hair, please! I just washed it.", "Eep, oil in the hair… not my favorite."],
  idle: ["…Everything okay back there?", "Hm? Are you still there?"],
  stone: ["Ooh, warm…", "Oh, that heat is lovely.", "Mmm, the stones are so cozy."],
  over: ["I think we're running a bit over time…", "Ah, I should probably get going soon."],
  quiet: ["Mm… I'd rather just relax quietly, if that's okay.", "Sorry, I'm not much of a talker."],
  small: ["Ha, yeah, the weather's been wild lately.", "I've been binge-watching this anime, it's so good.", "Work's been busy, but I'm hanging in there.", "This place smells amazing, by the way.", "I adopted a cat last month! She's a menace.", "I'm learning to cook. Mostly burning things."],
};
const PNAME = ['', 'Light', 'Medium', 'Firm'];

// ---------- Client generation ----------
function makeClient() {
  const idKey = weighted(Object.fromEntries(Object.entries(IDS).map(([k, v]) => [k, v.w])));
  const id = IDS[idKey];
  const masc = idKey === 'man' || idKey === 'transman';
  let req = S.owned.stones && Math.random() < 0.22 ? STONE_REQUEST : pick(REQUESTS);
  const duration = pick([30, 60, 60, 60, 90]);

  ses.minutes += dt * 0.75; // 1 real second = 0.75 in-game minutes

  for (const z of ZONES) { ses.red[z] = Math.max(0, ses.red[z] - dt * 0.04); ses.oil[z] = Math.max(0, ses.oil[z] - dt * 0.005); }

  // ambient comfort
  if (S.music) ses.comfort += dt * (S.owned.speakers ? 0.5 : 0.15);
  if (ses.minutes > c.duration) {
    if (!ses.overWarn) { ses.overWarn = true; say(pick(LINES.over), 'neutral', true); toast('⏰ Time is up — wrap up and end the session.'); }
    ses.comfort -= dt * 2.5;
    if (ses.minutes > c.duration + 12) { endSession(); return; }
  }

  // hot stones
  for (const s of ses.stones) {
    s.heat = Math.max(0, s.heat - dt / 45);
    if (s.heat > 0) {
      ses.tension[s.z] = Math.max(0, ses.tension[s.z] - dt * 1.6 * s.heat);
      ses.red[s.z] = Math.min(0.6, ses.red[s.z] + dt * 0.05 * s.heat);
      for (const k of ses.knots) if (!k.done && dist(k.x, k.y, s.x, s.y) < 60) { k.amt -= dt * 3.5 * s.heat; checkKnot(k); }

      if (Math.random() < dt * 2 * s.heat) particles.push({ type: 'steam', x: s.x + rand(-8, 8), y: s.y - 6, vx: 0, vy: -25, life: 1.4, max: 1.4, size: rand(4, 8) });
    }
  }

  // pointer interaction
  const move = Math.min(30, dist(ptr.x, ptr.y, ptr.lx, ptr.ly));
  ptr.lx = ptr.x; ptr.ly = ptr.y;
  const z = ptr.inside ? zoneAt(ptr.x, ptr.y) : null; ptr.zone = z;
  const active = ptr.down && ptr.inside && z && z !== 'towel';

  updateBodySim(dt, active, z);

  hands.squeeze = active && tool === 'hands' ? Math.min(1, hands.squeeze + dt * 6) : Math.max(0, hands.squeeze - dt * 4);

  ses.comfort = clamp(ses.comfort, 0, 100);
  if (ses.comfort <= 0) { walkout(); return; }
  refreshUI(false);
}

// ---------- Soft-tissue & body simulation ----------
// Per-region spring stiffness k, damping c and max indentation m: soft over muscle/fat, firm over bone.
const REGION = { head: [260, 26, 0.22], neck: [150, 15, 0.5], shoulderT: [120, 11, 0.7], shoulderB: [120, 11, 0.7], upperBack: [105, 9, 0.75],
  lowerBack: [75, 6.5, 0.95], armT: [90, 8, 0.8], armB: [90, 8, 0.8], handT: [220, 22, 0.35], handB: [220, 22, 0.35],
  calfT: [65, 5.5, 1], calfB: [65, 5.5, 1], footT: [170, 17, 0.45], footB: [170, 17, 0.45] };
function tissueAt(z, x, y) {
  const b = ses.c.body; let [k, c, m] = REGION[z];
  const dy = Math.abs(y - CY);
  if ((z === 'upperBack' || z === 'lowerBack' || z === 'neck') && dy < 10) { k *= 1.9; c *= 1.5; m *= 0.4; }           // spine
  if (z === 'upperBack' && x > 390 && x < 465 && Math.abs(dy - b.sw * 0.4) < 14) { k *= 1.5; m *= 0.6; }               // shoulder-blade ridge
  if (z.startsWith('calf') && x > 1005) { k *= 1.8; m *= 0.45; }                                                       // achilles / ankle
  k *= 1.15 - 0.35 * b.soft; m *= 0.85 + 0.35 * b.soft;
  return { k, c, m };
}
function flinch(s) {
  const dir = ptr.y < CY ? 1 : -1; // pull away from the hand
  ses.shift.vy += dir * 70 * s; ses.shift.vx += rand(-20, 20) * s;
  if (ses.contact) ses.contact.k *= 1.4; // muscle guards under the hand
}
function updateBodySim(dt, active, z) {
  const T = ses.tissue, sh = ses.shift, c = ses.c;
  const px = ptr.x - sh.x, py = ptr.y - sh.y;
  // contact: each hand position presses a tissue point; moving leaves a trail that springs back
  if (active && tool === 'hands') {
    let cur = ses.contact;
    if (!cur || dist(cur.x, cur.y, px, py) > 13) {
      if (cur) cur.held = false;
      cur = { x: px, y: py, z, d: cur ? cur.d * 0.6 : 0, v: 0, held: true, sx: 0, sy: 0, ...tissueAt(z, px, py) };
      T.push(cur); ses.contact = cur; if (T.length > 16) T.shift();
    }
    cur.target = (0.35 + 0.22 * pressure) * cur.m;
    cur.sx = clamp(px - cur.x, -7, 7); cur.sy = clamp(py - cur.y, -7, 7); // skin slides with the hand
  } else if (ses.contact) { ses.contact.held = false; ses.contact = null; }
  for (let i = T.length - 1; i >= 0; i--) {
    const t = T[i];
    if (!t.held) { t.target = 0; const f = Math.exp(-dt * 5); t.sx *= f; t.sy *= f; }
    t.v += (t.k * (t.target - t.d) - t.c * t.v) * dt; t.d += t.v * dt;
    if (!t.held && Math.abs(t.d) < 0.004 && Math.abs(t.v) < 0.03) T.splice(i, 1);

  ses.painT = Math.max(0, ses.painT - dt); ses.sigh = Math.max(0, ses.sigh - dt * 0.3);
  const tense = ses.painT > 0 || ses.comfort < 35;
  ses.breathPh += dt * (tense ? 0.45 : lerp(0.3, 0.18, ses.comfort / 100) - ses.sigh * 0.06) * Math.PI * 2;
  const amp = (0.011 + 0.006 * c.body.soft + ses.sigh * 0.02) * (ses.painT > 0 ? 0.45 : 1);
  ses.breathAmt = amp * (0.5 - 0.5 * Math.cos(ses.breathPh));
  // whole-body weight shift: idle drift, leaning into a good touch, flinching away from a bad one
  const lean = ptr.down && active && ses.comfort > 70 && pressure <= c.pref;
  const tx = lean ? clamp((px - 640) / 400, -1, 1) * 1.2 : 0;
  const ty = (lean ? clamp((py - CY) / 120, -1, 1) * 1.5 : 0) + Math.sin(time * 0.21) * 0.7;
  sh.vx += (40 * (tx - sh.x) - 8 * sh.vx) * dt; sh.vy += (40 * (ty - sh.y) - 8 * sh.vy) * dt;
  sh.x = clamp(sh.x + sh.vx * dt, -6, 6); sh.y = clamp(sh.y + sh.vy * dt, -6, 6);

}

function massage(z, move, dt) {
  const c = ses.c, P = pressure, pref = c.pref;
  const oiled = ses.oil[z] > 0.15, needsOil = NEEDS_OIL.has(z);
  let eff = (move * 0.012 + dt * 0.9) * (0.55 + 0.3 * P) * (S.owned.cert ? 1.25 : 1);
  if (needsOil && !oiled) eff *= 0.55;
  if (P < pref) eff *= P === pref - 1 ? 0.7 : 0.45;
  if (oiled && c.favScent === ses.oilScent?.[z]) eff *= 1.1;
  const before = ses.tension[z];
  ses.tension[z] = Math.max(0, before - eff * 1.0);
  ses.red[z] = Math.min(1, ses.red[z] + eff * 0.012 * P);
  if (oiled) ses.oil[z] = Math.max(0, ses.oil[z] - eff * 0.004);

  // knots respond to nearby work, and especially to steady held pressure
  for (const k of ses.knots) {
    if (k.done) continue;
    const d = dist(k.x, k.y, ptr.x, ptr.y);
    if (d < 40) {
      const fit = P >= pref ? 1 : 0.5;
      k.amt -= (eff * 2.0 + (move < 3 ? dt * 13 * (P / 3 + 0.34) : 0)) * fit * (S.owned.cert ? 1.25 : 1);
      if (Math.random() < dt * 8) float(k.x + rand(-10, 10), k.y - 10, '•', '#ff9a8a');
      checkKnot(k);
    }
  }

  // comfort reactions
  if (P > pref) {
    ses.comfort -= dt * (P - pref) * 7; ses.painT = 1.2;
    if (ses.complainCd <= 0) { say(pick(LINES.hard(PNAME[pref])), 'wince', true); ses.complainCd = 5; ses.known.pref = true; flinch(0.6 + 0.4 * (P - pref)); }
  } else if (z.startsWith('foot') && c.ticklish && P === 1 && move > 2) {
    ses.comfort -= dt * 5; ses.twitch[z.slice(-1)] = 1;
    if (ses.complainCd <= 0) { say(pick(LINES.tickle), 'laugh', true); ses.complainCd = 5; ses.known.tickle = true; flinch(0.35); }
  } else if (needsOil && !oiled && move > 3) {
    ses.comfort -= dt * 1.8;
    if (ses.complainCd <= 0) { say(pick(LINES.dry), 'neutral', true); ses.complainCd = 7; }
  } else {
    ses.comfort += dt * (1.6 + (P === pref ? 1.4 : 0));
    if (P < pref && ses.complainCd <= 0 && Math.random() < dt * 0.25) { say(pick(LINES.soft(PNAME[pref])), 'neutral', true); ses.complainCd = 8; ses.known.pref = true; }
    else if (!ses.zoneLineDone[z] && LINES.zone[z] && before > 20 && Math.random() < dt * 0.5) { ses.zoneLineDone[z] = true; say(LINES.zone[z], 'bliss'); }
    else if (Math.random() < dt * 0.12) say(pick(LINES.good), 'bliss');
  }
}
function checkKnot(k) {

  for (let i = 0; i < 14; i++) { const a = rand(0, 7); particles.push({ type: 'spark', x: k.x, y: k.y, vx: Math.cos(a) * rand(40, 120), vy: Math.sin(a) * rand(40, 120), life: 0.7, max: 0.7, size: rand(2, 4), color: '#ffe08a' }); }

}

// ---------- Ending sessions ----------
function computeResult(walked) {
  const c = ses.c, relax = relaxScore(), comfortN = ses.comfort / 100, timeUse = clamp(ses.minutes / c.duration, 0, 1);
  let score = relax * 0.6 + comfortN * 0.3 + timeUse * 0.1;

  if (ses.scentPraised) { score += 0.04; bonus.push('Favorite scent ✔'); }
  if (ses.released === ses.knots.length) { score += 0.03; bonus.push('All knots released ✔'); }
  let stars = walked ? 0.5 : clamp(Math.round(score * 5.3 * 2) / 2, 1, 5);
  const pay = walked ? 0 : Math.round(c.price * (stars >= 2 ? 1 : 0.5));
  const tip = stars >= 4 ? Math.round(c.price * (0.1 + (stars - 4) * 0.15 + (c.chatty && ses.talkCount ? 0.05 : 0))) : 0;
  return { relax, comfortN, timeUse, stars, pay, tip, bonus, walked };

  $('repStat').textContent = `⭐ ${rep().toFixed(1)}`;
  for (const [id, t] of [['tHands', 'hands'], ['tOil', 'oil'], ['tStone', 'stone']]) $(id).classList.toggle('on', tool === t);
  $('tStone').disabled = !S.owned.stones; $('tStone').title = S.owned.stones ? '' : 'Buy the Hot Stone Set in the shop';
  for (let i = 1; i <= 3; i++) $('p' + i).classList.toggle('on', pressure === i);
  $('bHeat').classList.toggle('on', heatView); $('bMusic').classList.toggle('on', S.music);
  const inSes = state === 'session' && ses && !ses.ended;
  $('bEnd').disabled = !inSes; $('bTalk').disabled = !inSes;
  if (!ses) return;
  const c = ses.c;
  $('timeTxt').textContent = `${Math.floor(Math.min(ses.minutes, 999))} / ${c.duration} min`;
  $('timeFill').style.width = clamp(ses.minutes / c.duration * 100, 0, 100) + '%';
  $('timeFill').classList.toggle('over', ses.minutes > c.duration);
  const r = relaxScore();
  $('relaxPct').textContent = Math.round(r * 100) + '%'; $('relaxFill').style.width = r * 100 + '%';
  $('comfortPct').textContent = Math.round(ses.comfort) + '%'; $('comfortFill').style.width = ses.comfort + '%';
  if (full) {
    $('cName').textContent = c.name; $('cPron').textContent = c.pron;
    $('cTags').innerHTML = `<span class="tag">${esc(c.idLabel)}</span><span class="tag">${c.duration} min</span><span class="tag">${esc(c.req.service)}</span><span class="tag">$${c.price}</span>`;
    $('cReq').textContent = '“' + c.req.text + '”';
  }
  $('focusList').innerHTML = c.req.focus.map(z => { const p = 1 - ses.tension[z] / Math.max(1, ses.init[z]); return `<div class="fz"><span>${ZLABEL[z]}</span><div class="bar"><div style="width:${clamp(p * 100, 0, 100)}%"></div></div></div>`; }).join('')
    + `<div class="fz"><span>Knots</span><b style="font-size:12px">${ses.released} / ${ses.knots.length}</b></div>`;
  const k = ses.known, u = '<span class="unk">??? (try Talk)</span>';
  $('knowList').innerHTML = `<div class="know"><span>Pressure</span>${k.pref ? `<b>${PNAME[c.pref]}</b>` : u}</div>
    <div class="know"><span>Favorite oil</span>${k.scent ? `<b>${SCENTS[c.favScent]}</b>` : u}</div>
    <div class="know"><span>Ticklish feet</span>${k.tickle ? `<b>${c.ticklish ? 'Yes (use firm)' : 'No'}</b>` : u}</div>
    <div class="know"><span>Oil in hair</span>${k.hairOil ? `<b>${c.hairOil ? 'Avoid!' : 'Fine'}</b>` : u}</div>
    <div class="know"><span>Chatty</span>${ses.talkCount ? `<b>${c.chatty ? 'Yes' : 'Prefers quiet'}</b>` : u}</div>`;
  // portrait expression
  let e = ses.exprT > 0 && ses.expr ? ses.expr : ses.comfort > 80 ? 'bliss' : ses.comfort > 55 ? 'happy' : ses.comfort > 30 ? 'neutral' : 'annoyed';
  if (e !== ses.lastExpr) { ses.lastExpr = e; drawPortrait(c, e); }
}
function showModal(html, buttons) {
  $('modal').innerHTML = html + `<div class="btns">${buttons.map((b, i) => `<button data-i="${i}" class="${b[2] || ''}">${b[0]}</button>`).join('')}</div>`;
  $('modal').querySelectorAll('.btns button').forEach(el => el.onclick = () => { initAudio(); buttons[+el.dataset.i][1](); });
  $('overlay').classList.add('show');
}
function hideModal() { $('overlay').classList.remove('show'); }
let prevState = 'session';
function pause() {
  if (state !== 'session') return;
  prevState = state; state = 'paused'; ptr.down = false;
  showModal(`<h2>⏸ Paused</h2><p>Take a breath. Your client is relaxing.</p>`,
    [['▶ Resume', () => resume(), 'primary'], ['❓ How to play', () => showHelp(() => { state = 'session'; pause(); }), ''], ['🏠 Save & quit to title', () => { saveGame(); ses = null; showTitle(); }, 'danger']]);
}
function resume() { hideModal(); state = 'session'; }
function showHelp(back) {
  showModal(`<h2>❓ How to play</h2><ul class="help">
    <li><b>Massage:</b> hold the mouse (or your finger) and rub over the client. Rubbing back and forth works the muscle.</li>
    <li><b>Knots:</b> hidden tight spots in focus areas. Hover shows “⚠ knot”. <b>Hold still with steady pressure</b> on them to release them. Turn on <b>🔥 Tension view</b> (T) to see tension and knots.</li>
    <li><b>Oil (W):</b> drag over back, shoulders, arms & calves first — dry skin drags and halves your effect. Scalp, neck, hands and feet don't need oil. Some clients hate oil in their hair!</li>
    <li><b>Pressure (1/2/3 or mouse wheel):</b> every client has a preference. Too hard hurts comfort; too soft is weak. They'll tell you, or ask with <b>💬 Talk</b> (C).</li>
    <li><b>Hot stones (R):</b> place on shoulders/back to melt tension passively. Click a stone to remove it.</li>
    <li><b>Draping:</b> the towel area is off-limits — keep it professional.</li>
    <li><b>End session (E)</b> when you're done. Rating = relaxation + comfort + time used. 4★+ earns tips.</li>
    <li>Pay rent each night, buy upgrades in the shop, raise your reputation to get more clients.</li></ul>`,
    [['Got it', back, 'primary']]);
}
function showTitle() {
  state = 'title'; hideModal();
  const cont = hasSave();
  showModal(`<h1>🌿 Serenity Hands</h1>
    <p>You're a massage therapist opening your own little spa. Read each client, find their knots, choose the right oil and pressure,
    and send them home feeling brand new. Build your reputation, earn cash, and upgrade your studio.</p>`,
    [...(cont ? [['▶ Continue', () => { loadGame(); afterLoad(); }, 'primary']] : []),
     ['✨ New game', () => { S = DEFAULT_SAVE(); saveGame(); afterLoad(); }, cont ? '' : 'primary'],
     ['❓ How to play', () => showHelp(showTitle), '']]);
}
function afterLoad() {
  refreshScents(); buildRoom(); refreshUI(true);
  if (!S.todayTotal) S.todayTotal = clientsToday();
  if (S.clientNo >= todayTotal()) showDayEndAgain(); else nextClient();
}

// ---------- Audio (soft ambient pad + chimes) ----------
let AC = null, master = null, musicGain = null, musicTimer = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = S.music ? 0.22 : 0; musicGain.connect(master);
    startMusic();
  } catch (e) { AC = null; }
}
const CHORDS = [[261.6, 329.6, 392.0, 493.9], [220.0, 261.6, 329.6, 392.0], [174.6, 220.0, 261.6, 329.6], [196.0, 246.9, 293.7, 392.0]];
function startMusic() {
  let i = 0;
  const play = () => {
    if (!AC) return;
    const t = AC.currentTime, ch = CHORDS[i++ % CHORDS.length];
    ch.forEach((f, j) => {
      const o = AC.createOscillator(), gn = AC.createGain();
      o.type = j % 2 ? 'triangle' : 'sine'; o.frequency.value = f / (j === 0 ? 2 : 1);
      gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(0.09, t + 2.5); gn.gain.linearRampToValueAtTime(0.0001, t + 8.5);
      o.connect(gn); gn.connect(musicGain); o.start(t); o.stop(t + 9);
    });
    // a gentle bell note on top
    const o = AC.createOscillator(), gn = AC.createGain(); o.type = 'sine'; o.frequency.value = ch[randi(0, 3)] * 2;
    gn.gain.setValueAtTime(0, t + 1); gn.gain.linearRampToValueAtTime(0.05, t + 1.05); gn.gain.exponentialRampToValueAtTime(0.0001, t + 4);
    o.connect(gn); gn.connect(musicGain); o.start(t + 1); o.stop(t + 4.2);
  };
  play(); musicTimer = setInterval(play, 7000);
}
function tone(f, d, v, type) {
  if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), gn = AC.createGain();
  o.type = type || 'sine'; o.frequency.value = f; gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(gn); gn.connect(master); o.start(t); o.stop(t + d + 0.05);
}
function chime() { tone(880, 0.8, 0.12); setTimeout(() => tone(1320, 0.9, 0.08), 90); }
function cashSound() { tone(1046, 0.25, 0.12, 'triangle'); setTimeout(() => tone(1568, 0.4, 0.1, 'triangle'), 110); }
function toggleMusic() { S.music = !S.music; saveGame(); if (musicGain) musicGain.gain.setTargetAtTime(S.music ? 0.22 : 0, AC.currentTime, 0.3); refreshUI(true); toast(S.music ? '🎵 Music on' : '🔇 Music off'); }

// ---------- Input ----------
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => {
  initAudio(); const p = toLogical(e); ptr.x = ptr.lx = p.x; ptr.y = ptr.ly = p.y; ptr.inside = true; ptr.touch = e.pointerType !== 'mouse';
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  ptr.down = true; try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (state !== 'session' || !ses) return;
  const z = zoneAt(p.x, p.y);
  if (z === 'towel') { toast('🚫 That area stays draped — keep it professional.'); return; }
  if (tool === 'stone' && z) clickStone(p.x, p.y, z);
  else if (tool === 'stone') toast('🪨 Place stones on the shoulders or back.');
  e.preventDefault();
});
cv.addEventListener('pointermove', e => { const p = toLogical(e); ptr.x = clamp(p.x, 0, W); ptr.y = clamp(p.y, 0, H); ptr.inside = p.x >= 0 && p.x <= W && p.y >= 0 && p.y <= H; ptr.touch = e.pointerType !== 'mouse'; });
const up = () => { ptr.down = false; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('pointerleave', () => { if (!ptr.down) ptr.inside = false; });
cv.addEventListener('lostpointercapture', up);
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => { if (state !== 'session') return; e.preventDefault(); setPressure(pressure + (e.deltaY > 0 ? -1 : 1)); }, { passive: false });
window.addEventListener('blur', () => { up(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'session') pause(); });
function setTool(t) {
  if (t === 'stone' && !S.owned.stones) { toast('🪨 Buy the Hot Stone Set in the shop to unlock stones.'); return; }
  tool = t; refreshUI(true);
}
function setPressure(p) { pressure = clamp(p, 1, 3); refreshUI(true); toast(`Pressure: ${PNAME[pressure]}`); }
$('tHands').onclick = () => setTool('hands'); $('tOil').onclick = () => setTool('oil'); $('tStone').onclick = () => setTool('stone');
$('scentSel').onchange = e => { scent = e.target.value; setTool('oil'); };
for (let i = 1; i <= 3; i++) $('p' + i).onclick = () => setPressure(i);
$('bHeat').onclick = () => { heatView = !heatView; refreshUI(true); };
$('bTalk').onclick = () => talk();
$('bMusic').onclick = () => { initAudio(); toggleMusic(); };
$('bPause').onclick = () => state === 'paused' ? resume() : pause();
$('bEnd').onclick = () => endSession(true);
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if (k === 'escape') { if (state === 'session') pause(); else if (state === 'paused') resume(); return; }
  if (state !== 'session') return;
  if (k === 'q') setTool('hands'); else if (k === 'w') setTool('oil'); else if (k === 'r') setTool('stone');
  else if (k === '1' || k === '2' || k === '3') setPressure(+k);
  else if (k === 't') { heatView = !heatView; refreshUI(true); }
  else if (k === 'c') talk(); else if (k === 'm') { initAudio(); toggleMusic(); }
  else if (k === 'e') endSession(true);
});
window.addEventListener('resize', resize);

// ---------- Main loop ----------
let lastT = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  try { update(dt); render(); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
resize(); refreshScents(); refreshUI(true); showTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
