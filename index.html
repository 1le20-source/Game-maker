<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Serenity Hands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#141a1c; --panel:#1d2629; --panel2:#243034; --line:#33444a;
  --text:#eef3f1; --muted:#9fb2ae; --gold:#e8c37a; --teal:#4fc1a6;
  --pink:#f08bb0; --red:#e86a5f; --green:#6fd08c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%}
#topbar{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:800;color:var(--gold);letter-spacing:.5px;margin-right:auto}
.stat{background:var(--panel2);padding:4px 10px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}
#timeWrap{display:flex;align-items:center;gap:8px;min-width:200px}
#timeBar{flex:1;height:8px;background:#0e1314;border-radius:6px;overflow:hidden;min-width:100px}
#timeFill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .2s}
#timeFill.over{background:var(--red)}
#main{flex:1;display:flex;min-height:0}
#side{width:270px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:12px;overflow-y:auto}
#portrait{width:100%;max-width:200px;aspect-ratio:1;display:block;margin:0 auto 8px;border-radius:16px;border:2px solid var(--line);background:#222}
.cname{font-size:20px;font-weight:800;text-align:center}
.pron{font-size:13px;color:var(--muted);font-weight:600}
.tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.req{font-style:italic;color:#d6e2df;font-size:13.5px;background:#18201f;border-left:3px solid var(--gold);padding:6px 8px;border-radius:6px;margin:8px 0}
h4{margin:12px 0 6px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.meter{margin:6px 0}
.meter .lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.bar{height:10px;background:#0e1314;border-radius:6px;overflow:hidden;margin-top:3px}
.bar>div{height:100%;width:0;transition:width .15s}
#relaxFill{background:linear-gradient(90deg,#3aa58a,var(--green))}
#comfortFill{background:linear-gradient(90deg,#c0607f,var(--pink))}
.fz{display:flex;align-items:center;gap:6px;font-size:12.5px;margin:3px 0}
.fz span{width:96px}
.fz .bar{flex:1;margin:0;height:7px}
.fz .bar>div{background:linear-gradient(90deg,var(--red),var(--gold),var(--green))}
.know{font-size:13px;margin:3px 0;display:flex;justify-content:space-between;gap:6px}
.know b{color:var(--gold)}
.know .unk{color:#6e807c}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;overflow:hidden;background:#0d1112}
#game{display:block;touch-action:none;cursor:none;border-radius:6px}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(15,20,22,.92);border:1px solid var(--line);
  padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#toolbar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap;justify-content:center}
.grp{display:flex;gap:4px;align-items:center;background:#18201f;padding:4px;border-radius:12px}
.grp .gl{font-size:11px;color:var(--muted);padding:0 6px;text-transform:uppercase;letter-spacing:1px}
button{font-family:inherit;font-weight:700;font-size:14px;color:var(--text);background:var(--panel2);border:1px solid var(--line);
  padding:8px 12px;border-radius:10px;cursor:pointer;transition:background .15s,transform .05s;white-space:nowrap}
button:hover{background:#2e3d42}
button:active{transform:translateY(1px)}
button.on{background:var(--teal);color:#0d1a17;border-color:var(--teal)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--gold);color:#2a1f08;border-color:var(--gold)}
button.primary:hover{background:#f3d396}
button.danger{background:#5a2a2a;border-color:#7a3a3a}
kbd{font-size:10px;opacity:.6;margin-left:4px;font-family:inherit}
select{font-family:inherit;font-weight:700;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px}
#overlay{position:fixed;inset:0;background:rgba(5,8,9,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#overlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:620px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h1{margin:0 0 6px;color:var(--gold);font-size:30px}
.modal h2{margin:0 0 10px;color:var(--gold)}
.modal p{color:#d3dfdc;line-height:1.5}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;justify-content:center}
.intro{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.intro canvas{width:150px;height:150px;border-radius:14px;border:2px solid var(--line)}
.stars{font-size:34px;color:var(--gold);letter-spacing:2px;text-align:center}
.rows{margin:10px 0}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.row.total{font-weight:800;font-size:18px;border:none;color:var(--gold)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.item .t{font-weight:800}
.item .d{font-size:13px;color:var(--muted);flex:1}
.help li{margin:4px 0;color:#d3dfdc}
.stw{white-space:nowrap}.st{color:#4a5a5e}.st.full{color:var(--gold)}
.st.half{background:linear-gradient(90deg,var(--gold) 50%,#4a5a5e 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
body.world .sessOnly,body.world #sessPanel,body.world #timeWrap{display:none!important}
body:not(.world) #worldPanel,body:not(.world) #worldTools{display:none!important}
.ctl{font-size:13px;color:var(--muted);line-height:1.6}.ctl b{color:var(--text)}
.qi{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.qi .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.qi .bar{flex:1;height:6px;margin:0}.qi .bar>div{background:linear-gradient(90deg,var(--red),var(--gold),var(--green))}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:40}
#fade.on{opacity:1}
.quote{font-style:italic;text-align:center;color:#d6e2df;margin:8px 0}
@media (max-width:820px){
  #main{flex-direction:column}
  #side{width:100%;max-height:150px;display:grid;grid-template-columns:90px 1fr;gap:4px 10px;border-right:none;border-bottom:1px solid var(--line);padding:8px}
  #portrait{grid-row:span 6;width:90px;margin:0}
  .cname{text-align:left;font-size:16px}.tags{justify-content:flex-start}
  #side h4,#focusList,#knowList,#queueList,.ctl{display:none}
  #worldPanel{grid-column:1/-1}
  .req{margin:2px 0;font-size:12px}
  button{padding:7px 9px;font-size:13px} kbd{display:none}
  .brand{display:none}
}
</style>
</head>

<script>
// Show start-up errors on screen instead of failing silently.
window.addEventListener('error', function (e) {
  var d = document.getElementById('bootErr');
  if (!d) { d = document.createElement('div'); d.id = 'bootErr'; d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#5a2a2a;color:#fff;padding:10px 14px;border-radius:10px;font:13px/1.4 sans-serif'; document.body.appendChild(d); }
  d.textContent = 'Something went wrong: ' + (e.message || e) + ' — try reloading the page.';
});
</script>

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function weighted(obj) { // {key: weight}
  const entries = Object.entries(obj); let t = 0;
  for (const [, w] of entries) t += w;
  let r = Math.random() * t;
  for (const [k, w] of entries) { r -= w; if (r <= 0) return k; }
  return entries[0][0];
}
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function shade(hex, amt) { // amt -1..1
  const [r, g, b] = hexToRgb(hex);
  const f = c => clamp(Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt), 0, 255);
  return '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, '0')).join('');
}
function rgba(hex, a) { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function update(dt) {
  time += dt;

    const p = particles[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.type === 'drop') p.vy += 900 * dt; if (p.type === 'steam') { p.vx += Math.sin(time * 3 + i) * 8 * dt; }
    if (p.life <= 0 || (p.type === 'drop' && p.y >= p.ty)) {
      if (p.type === 'drop') for (let j = 0; j < 3; j++) particles.push({ type: 'splash', x: p.x, y: p.ty, vx: rand(-40, 40), vy: rand(-60, -10), life: 0.3, max: 0.3, color: p.color, size: 2 });
      particles.splice(i, 1);
    }
  }
  for (let i = floaters.length - 1; i >= 0; i--) { const f = floaters[i]; f.life -= dt; f.y -= 28 * dt; if (f.life <= 0) floaters.splice(i, 1); }
  if (bubble) { bubble.t -= dt; if (bubble.t <= 0) bubble = null; }
  if (view === 'world') { if (state === 'world') updateWorld(dt); return; }
  if (state !== 'session' || !ses) return;

  const c = ses.c;
  ses.minutes += dt; // 1 real second = 1 in-game minute
  ses.lineCd -= dt; ses.talkCd -= dt; ses.complainCd -= dt; ses.exprT -= dt;
  for (const z of ZONES) { ses.red[z] = Math.max(0, ses.red[z] - dt * 0.04); ses.oil[z] = Math.max(0, ses.oil[z] - dt * 0.005); }

  // ambient comfort
  if (S.music) ses.comfort += dt * (S.owned.speakers ? 0.5 : 0.15);
  if (ses.minutes > c.duration) {
    if (!ses.overWarn) { ses.overWarn = true; say(pick(LINES.over), 'neutral', true); toast('⏰ Time is up — wrap up and end the session.'); }
    ses.comfort -= dt * 2.5;
    if (ses.minutes > c.duration + 12) { endSession(); return; }
  }

  // hot stones
  for (const s of ses.stones) {
    s.heat = Math.max(0, s.heat - dt / 45);
    if (s.heat > 0) {
      ses.tension[s.z] = Math.max(0, ses.tension[s.z] - dt * 1.6 * s.heat);
      ses.red[s.z] = Math.min(0.6, ses.red[s.z] + dt * 0.05 * s.heat);
      for (const k of ses.knots) if (!k.done && dist(k.x, k.y, s.x, s.y) < 60) { k.amt -= dt * 3.5 * s.heat; checkKnot(k); }
      ses.comfort += dt * 0.35 * s.heat;
      if (Math.random() < dt * 2 * s.heat) particles.push({ type: 'steam', x: s.x + rand(-8, 8), y: s.y - 6, vx: 0, vy: -25, life: 1.4, max: 1.4, size: rand(4, 8) });
    }
  }

  // pointer interaction
  const move = Math.min(30, dist(ptr.x, ptr.y, ptr.lx, ptr.ly));
  ptr.lx = ptr.x; ptr.ly = ptr.y;
  const z = ptr.inside ? zoneAt(ptr.x, ptr.y) : null; ptr.zone = z;
  const active = ptr.down && ptr.inside && z && z !== 'towel';
  if (!active) ses.idle += dt; else ses.idle = 0;
  if (ses.idle > 7) { ses.comfort -= dt * 0.8; if (ses.idle > 9 && ses.idle < 9 + dt * 1.5) say(pick(LINES.idle), 'neutral'); }

  updateBodySim(dt, active, z);
  if (active && tool === 'hands') massage(z, move, dt);
  else if (active && tool === 'oil') applyOil(z, dt);
  hands.squeeze = active && tool === 'hands' ? Math.min(1, hands.squeeze + dt * 6) : Math.max(0, hands.squeeze - dt * 4);
  if (active && tool === 'hands') hands.phase += dt * (3 + move * 0.4);

  ses.comfort = clamp(ses.comfort, 0, 100);
  if (ses.comfort <= 0) { walkout(); return; }
  refreshUI(false);
}

// ---------- Soft-tissue & body simulation ----------
// Per-region spring stiffness k, damping c and max indentation m: soft over muscle/fat, firm over bone.

  lowerBack: [75, 6.5, 0.95], armT: [90, 8, 0.8], armB: [90, 8, 0.8], handT: [220, 22, 0.35], handB: [220, 22, 0.35],

  if (z === 'upperBack' && x > 390 && x < 465 && Math.abs(dy - b.sw * 0.4) < 14) { k *= 1.5; m *= 0.6; }               // shoulder-blade ridge
  if (z.startsWith('calf') && x > 1005) { k *= 1.8; m *= 0.45; }                                                       // achilles / ankle

function updateBodySim(dt, active, z) {

function massage(z, move, dt) {

  if (oiled && c.favScent === ses.oilScent?.[z]) eff *= 1.1;

  // knots respond to nearby work, and especially to steady held pressure
  for (const k of ses.knots) {

    const d = dist(k.x, k.y, ptr.x, ptr.y);
    if (d < 40) {

      k.amt -= (eff * 2.0 + (move < 3 ? dt * 13 * (P / 3 + 0.34) : 0)) * fit * (S.owned.cert ? 1.25 : 1);

}

    if (isFree(player.x + vx, player.y, PR)) player.x += vx; if (isFree(player.x, player.y + vy, PR)) player.y += vy;
    player.dir = Math.abs(vx) > Math.abs(vy) ? (vx > 0 ? 'right' : 'left') : (vy > 0 ? 'down' : 'up');
    player.ph += Math.hypot(vx, vy) * 0.11; moved = true;
    const last = player.trail[player.trail.length - 1];
    if (!last || dist(last.x, last.y, player.x, player.y) > 12) { player.trail.push({ x: player.x, y: player.y }); if (player.trail.length > 40) player.trail.shift(); }
  }
  player.moving = moved;
}
function interactables() {
  const list = [], f = follower();
  for (const e of ents) if (e.state === 'seated' || e.state === 'arrive') list.push({ x: e.x, y: e.y, spot: e.state === 'seated' ? { x: e.x, y: SPOT.seatFrontY } : { x: e.x, y: e.y }, label: `Greet ${e.c.name}`, act: () => greet(e), ent: e });
  list.push({ x: SPOT.table.x, y: 290, spot: SPOT.table, label: f ? `Start ${f.c.name}'s massage` : 'Bring a client here to start a massage', act: () => f ? beginMassage(f) : toast('Greet a client in the waiting area first.') });
  list.push({ x: F.cabinet.x + 23, y: F.cabinet.y + 75, spot: SPOT.cabinet, label: 'Supply cabinet (upgrades)', act: () => openShopWorld() });
  list.push({ x: F.tea.x + 86, y: F.tea.y + 28, spot: SPOT.tea, label: S.teaBuff ? 'Tea is ready (+comfort next session)' : 'Brew calming tea', act: () => brewTea() });
  return list;
}
let nearCache = null;
function nearInteract() {
  let best = null, bd = 72;
  for (const it of interactables()) { const d = Math.min(dist(player.x, player.y, it.spot.x, it.spot.y), dist(player.x, player.y, it.x, it.y)); if (d < bd) { bd = d; best = it; } }
  nearCache = best; return best;
}
function interact() { if (state !== 'world') return; const it = nearInteract(); if (it) it.act(); else toast('Walk up to a client or object to interact.'); }
function greet(e) {
  if (follower()) { toast(`Finish with ${follower().c.name} first.`); return; }
  const c = e.c; state = 'modal';
  showModal(`<h2>👋 ${esc(c.name)}</h2>
    <div class="intro"><canvas id="introP" width="300" height="300"></canvas>
    <div style="flex:1;min-width:220px">
      <div class="cname" style="text-align:left">${esc(c.name)} <span class="pron">${esc(c.pron)}</span></div>
      <div class="tags" style="justify-content:flex-start"><span class="tag">${esc(c.idLabel)}</span><span class="tag">${c.duration} min · ${esc(c.req.service)}</span><span class="tag">💵 $${c.price}</span></div>
      <div class="req">“${esc(c.req.text)}”</div>
      <p style="font-size:13px;margin:4px 0">Focus: <b>${c.req.focus.map(z => ZLABEL[z]).join(', ')}</b></p>
    </div></div>`,
    [['Follow me to the treatment room →', () => { hideModal(); state = 'world'; e.state = 'follow'; e.seat = -1; e.path = null; player.trail = [{ x: e.x, y: e.y }]; setEmote(e, '🙂', 2); toast(`Lead ${c.name} to the Treatment Room`); }, 'primary'],
     ['Not yet', () => { hideModal(); state = 'world'; }, '']]);
  drawPortrait(c, 'happy'); const ip = $('introP'); if (ip) ip.getContext('2d').drawImage(pcv, 0, 0, 300, 300);
}
function beginMassage(e) {
  if (dist(e.x, e.y, SPOT.table.x, SPOT.table.y) > 260) { toast(`Wait for ${e.c.name} to catch up.`); return; }
  state = 'modal'; $('fade').classList.add('on');
  setTimeout(() => {
    world.curEnt = e; e.state = 'onTable';
    view = 'massage'; document.body.classList.remove('world'); resize();
    state = 'session'; startSession(e.c);
    if (S.teaBuff) { ses.comfort = Math.min(100, ses.comfort + 8); S.teaBuff = false; saveGame(); toast('🍵 Your calm from the tea carries into the session'); }
    $('fade').classList.remove('on');
  }, 380);
}
function returnToWorld() {
  hideModal(); $('fade').classList.add('on');
  setTimeout(() => {
    view = 'world'; document.body.classList.add('world'); resize(); state = 'world';
    const e = world.curEnt; world.curEnt = null;
    if (e) { e.state = 'leaving'; e.x = SPOT.table.x + 50; e.y = SPOT.table.y; e.path = null; e.tasks = [{ to: SPOT.desk, wait: 1.2, say: 'pay' }, { to: SPOT.door }, { to: SPOT.gate, then: 'gone' }];
      const st = S.ratings[S.ratings.length - 1]; setEmote(e, st >= 4 ? '💖' : st >= 3 ? '🙂' : '😒', 3); e.c.look.mood = st >= 4 ? 'happy' : ''; }
    player.x = SPOT.table.x; player.y = SPOT.table.y + 10; player.dir = 'down'; player.path = null; player.trail = [];
    ses = null; $('fade').classList.remove('on'); refreshUI(true);
  }, 380);
}
function brewTea() {
  if (S.teaBuff) { toast('🍵 Your tea is ready — it will help your next session.'); return; }
  S.teaBuff = true; saveGame(); toast('🍵 You brew a pot of green tea. Next client starts more relaxed.');
}
function openShopWorld() { state = 'modal'; showShop(() => { hideModal(); state = 'world'; }); }
function startDayWorld() {
  hideModal(); view = 'world'; document.body.classList.add('world'); state = 'world';
  ents.length = 0; world.curEnt = null; world.spawned = S.clientNo; world.spawnT = 0.6; ses = null;
  player.x = SPOT.start.x; player.y = SPOT.start.y; player.dir = 'up'; player.path = null; player.trail = [];
  buildWorld(); resize(); refreshUI(true);
  toast(`☀️ Day ${S.day} — the spa is open!`);
}
function updateWorld(dt) {
  playerMove(dt);
  for (const e of ents) updateEnt(e, dt);
  for (let i = ents.length - 1; i >= 0; i--) if (ents[i].state === 'gone') ents.splice(i, 1);
  world.spawnT -= dt;
  if (world.spawnT <= 0 && world.spawned < todayTotal()) { if (spawnClient()) world.spawnT = rand(5, 9); else world.spawnT = 1; }
  if (world.spawned >= todayTotal() && S.clientNo >= todayTotal() && !ents.length && state === 'world') { showDayEnd(); return; }
  const c = world.cam, tx = clamp(player.x - W / 2, 0, WW - W), ty = clamp(player.y - H / 2, 0, WH - H);
  c.x += (tx - c.x) * Math.min(1, dt * 6); c.y += (ty - c.y) * Math.min(1, dt * 6);
  refreshWorldUI();
}
let lastWUI = 0;
function refreshWorldUI() {
  const now = performance.now(); if (now - lastWUI < 200) return; lastWUI = now;
  const f = follower(), seated = ents.filter(e => e.state === 'seated');
  let obj;
  if (f) obj = `Lead <b>${esc(f.c.name)}</b> to the <b>Treatment Room</b> and press <b>E</b> at the table.`;
  else if (seated.length) obj = `<b>${esc(seated[0].c.name)}</b> is waiting. Walk to the waiting area and press <b>E</b> to greet them.`;
  else if (ents.some(e => e.state === 'arrive')) obj = `<b>${esc(ents.find(e => e.state === 'arrive').c.name)}</b> just walked in. Go say hi (press <b>E</b> next to them).`;
  else if (world.spawned < todayTotal()) obj = 'A client is on the way. Brew tea in the lounge or check the supply cabinet while you wait.';
  else obj = 'That was the last booking. Wait for everyone to leave to close up for the day.';
  $('objective').innerHTML = obj;
  $('queueList').innerHTML = ents.filter(e => e.state !== 'gone').map(e => {
    const st = { arrive: 'Checking in', seated: 'Waiting', follow: 'Following you', leaving: 'Leaving', onTable: 'On the table' }[e.state] || '';
    const p = e.state === 'seated' ? clamp(e.patience / e.maxPatience, 0, 1) : 1;
    return `<div class="qi"><span class="dot" style="background:${e.c.look.top}"></span><span style="width:70px">${esc(e.c.name)}</span><span style="width:86px;color:var(--muted)">${st}</span>${e.state === 'seated' ? `<div class="bar"><div style="width:${p * 100}%"></div></div>` : ''}</div>`;
  }).join('') || '<div class="ctl">Nobody here yet.</div>';
  $('moneyStat').textContent = `💵 $${S.money}`;
  $('dayStat').textContent = `Day ${S.day} · ${S.clientNo}/${todayTotal()} clients`;
  $('repStat').textContent = `⭐ ${rep().toFixed(1)}`;
}
function renderWorld() {
  const g = ctx, cam = world.cam, KW = world.buildK || 1;
  if (!world.buildK) buildWorld();
  g.setTransform(1, 0, 0, 1, 0, 0); g.imageSmoothingEnabled = true;
  g.drawImage(worldC, cam.x * KW, cam.y * KW, W * KW, H * KW, 0, 0, cv.width, cv.height);
  g.setTransform(K, 0, 0, K, -cam.x * K, -cam.y * K);
  // animated details: koi, fountain ripples, candle flames, tea steam
  const pb = F.pond, pcx = pb.x + pb.w / 2, pcy = pb.y + pb.h / 2;
  for (let i = 0; i < 4; i++) { const a = time * (0.35 + i * 0.07) + i * 1.7, fx = pcx + Math.cos(a) * (60 - i * 10), fy = pcy + Math.sin(a) * (32 - i * 4);
    g.save(); g.translate(fx, fy); g.rotate(a + Math.PI / 2); g.fillStyle = i % 2 ? '#f08a3c' : '#f4f0e6'; g.beginPath(); g.ellipse(0, 0, 9, 3.6, 0, 0, 7); g.fill(); g.beginPath(); g.moveTo(-8, 0); g.lineTo(-14, -4 + Math.sin(time * 8 + i) * 2); g.lineTo(-14, 4); g.fill(); g.restore(); }
  const fo = F.fountain; for (let i = 0; i < 3; i++) { const r = ((time * 14 + i * 12) % 34) + 6; g.strokeStyle = `rgba(255,255,255,${0.35 * (1 - r / 40)})`; g.lineWidth = 1.2; g.beginPath(); g.arc(fo.x + 42, fo.y + 42, r, 0, 7); g.stroke(); }
  for (const [x, y] of [[1620, 560], [1290, 560], [1700, 220]]) { const f = 1 + Math.sin(time * 12 + x) * 0.15; const gl = g.createRadialGradient(x, y, 1, x, y, 30 * f); gl.addColorStop(0, 'rgba(255,190,90,.35)'); gl.addColorStop(1, 'rgba(255,190,90,0)'); g.fillStyle = gl; g.beginPath(); g.arc(x, y, 30 * f, 0, 7); g.fill(); g.fillStyle = '#f5ecd9'; g.beginPath(); g.arc(x, y, 6, 0, 7); g.fill(); g.fillStyle = '#ffd36e'; g.beginPath(); g.arc(x, y, 2.6 * f, 0, 7); g.fill(); }
  if (S.teaBuff) for (let i = 0; i < 3; i++) { const t = (time * 0.6 + i / 3) % 1; g.fillStyle = `rgba(255,255,255,${0.3 * (1 - t)})`; g.beginPath(); g.arc(F.tea.x + 40 + Math.sin(time * 2 + i) * 3, F.tea.y + 22 - t * 26, 4 + t * 5, 0, 7); g.fill(); }
  // people, depth-sorted
  const people = ents.filter(e => e.state !== 'onTable').map(e => ({ y: e.y, draw: () => {
    drawPerson(g, e.x, e.y, e.c.look, e.dir, e.ph, e.moving, e.state === 'seated' ? 'sit' : '', e.c.look.mood);
    if (e.state === 'seated') { const p = clamp(e.patience / e.maxPatience, 0, 1); g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 4; g.beginPath(); g.arc(e.x + 22, e.y - 142, 7, 0, 7); g.stroke(); g.strokeStyle = p > 0.5 ? '#6fd08c' : p > 0.25 ? '#e8c37a' : '#e86a5f'; g.lineWidth = 3; g.beginPath(); g.arc(e.x + 22, e.y - 142, 7, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2); g.stroke(); }
    if (e.emote) { g.font = '20px system-ui'; g.textAlign = 'center'; g.fillText(e.emote, e.x, e.y - 150 - Math.sin(time * 4) * 2); g.textAlign = 'left'; }
    if (dist(e.x, e.y, player.x, player.y) < 260) { g.font = '800 12px Nunito, system-ui'; g.textAlign = 'center'; g.fillStyle = 'rgba(0,0,0,.5)'; g.fillText(e.c.name, e.x + 1, e.y + 21); g.fillStyle = '#fff'; g.fillText(e.c.name, e.x, e.y + 20); g.textAlign = 'left'; }
  } }));
  people.push({ y: player.y, draw: () => drawPerson(g, player.x, player.y, PLAYER_LOOK, player.dir, player.ph, player.moving, '') });
  people.sort((a, b) => a.y - b.y).forEach(p => p.draw());
  // click-to-walk marker
  if (player.path && player.path.length) { const t = player.path[player.path.length - 1]; g.strokeStyle = 'rgba(120,230,200,.8)'; g.lineWidth = 2; g.beginPath(); g.arc(t.x, t.y, 8 + Math.sin(time * 6) * 2, 0, 7); g.stroke(); }
  // interaction prompt
  const it = state === 'world' ? nearInteract() : null;
  if (it) { const txt = (it.label.startsWith('Bring') ? '' : 'E  ') + it.label; g.font = '800 14px Nunito, system-ui'; const w = g.measureText(txt).width + 22, px = it.x - w / 2, py = it.y - (it.ent ? 185 : 60);
    g.fillStyle = 'rgba(12,16,18,.85)'; rr(g, px, py, w, 28, 14); g.fill(); g.strokeStyle = '#e8c37a'; g.lineWidth = 1.5; g.stroke(); g.fillStyle = '#fff'; g.fillText(txt, px + 11, py + 19); }
  g.setTransform(K, 0, 0, K, 0, 0);

  const f = follower(), seated = ents.find(e => e.state === 'seated') || ents.find(e => e.state === 'arrive');
  const target = f ? SPOT.table : seated ? { x: seated.x, y: seated.y - 30 } : null;
  if (target && state === 'world') {
    const sx = target.x - cam.x, sy = target.y - cam.y;
    if (sx < 30 || sx > W - 30 || sy < 30 || sy > H - 30) {
      const cx = W / 2, cy = H / 2, a = Math.atan2(sy - cy, sx - cx), ex = clamp(cx + Math.cos(a) * 2000, 40, W - 40), ey = clamp(cy + Math.sin(a) * 2000, 40, H - 40);
      g.save(); g.translate(ex, ey); g.rotate(a); g.fillStyle = 'rgba(232,195,122,.95)'; g.beginPath(); g.moveTo(16, 0); g.lineTo(-10, -11); g.lineTo(-4, 0); g.lineTo(-10, 11); g.closePath(); g.fill(); g.restore();
    }
  }
}

// ---------- Main loop ----------
let lastT = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  try { update(dt); render(); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
resize(); refreshScents(); refreshUI(true); showTitle();
requestAnimationFrame(frame);
</script>
