<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Body Studio</title>
<link rel="stylesheet" href="css/studio.css">
</head>
<body>
<div id="stage"></div>
<div id="ui"></div>
<div id="loading"><div class="spinner"></div><p>Building your human…</p></div>
<script src="lib/three.min.js"></script>
<script src="assets/body-data.js"></script>
<script src="js/params.js"></script>
<script src="js/core.js"></script>
<script src="js/human.js"></script>
<script src="js/app.js"></script>
<script src="js/stage.js"></script>
<script src="js/skin.js"></script>
<script src="js/motion.js"></script>
<script src="js/hair.js"></script>
<script src="js/fabric.js"></script>
<script src="js/clothing.js"></script>
<script src="js/anatomy.js"></script>
<script src="js/ui.js"></script>
<script>
  (function () {
    const q = new URLSearchParams(location.search);
    if (q.get('ui') === '0') document.body.classList.add('no-ui');
    const app = new BS.App(document.getElementById('stage'));
    window.app = app;
    app.init().then(() => {
      document.getElementById('loading').remove();
      if (BS.UI && q.get('ui') !== '0') BS.UI(app, document.getElementById('ui'));
      window.ready = true;
    }).catch((e) => {
      console.error(e);
      document.getElementById('loading').innerHTML = '<p>Body Studio could not start: ' + e.message + '</p>';
      window.err = String(e && e.stack || e);
      window.done = true;
    });
  })();
</script>
</body>
</html>
