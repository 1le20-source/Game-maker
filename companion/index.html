<title>Mira's Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A cosy 3D companion: chat, play and hang out with Mira in her night-lit room.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: the 3D room fills the screen; UI floats on top. Phone: HUD on top, chat + dock at the
   thumb end. Wide screens: chat moves into a right-hand column so she stands in the open space. */
:root {
  color-scheme: dark;
  --night: #0c0f22;          /* page ground, deep night */
  --panel: #161a35;          /* sheets and dialogs */
  --panel-2: #1e2346;        /* raised rows */
  --glass: rgba(13, 16, 36, 0.66);
  --line: rgba(255, 236, 214, 0.14);
  --text: #f6eee2;           /* warm off-white */
  --muted: #b7b1c8;
  --paper: #fcf3e6;          /* her speech balloons */
  --paper-edge: #3a2f45;
  --paper-ink: #2b2236;
  --lamp: #ffb45e;           /* warm lamp amber, the accent */
  --lamp-ink: #2a1a0a;
  --rose: #ff7f98;           /* affection */
  --moon: #bed3ff;           /* cool secondary */
  --mint: #8fd6be;
  --danger: #ff8f80;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --kb: 0px;
}
html { height: 100%; box-sizing: border-box; background: var(--night); }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--night); color: var(--text);
  font: 400 15px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.ico { display: block; flex: none; }
.muted { color: var(--muted); }

#app { position: relative; height: 100%; overflow: hidden; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: var(--night); }
#fade { position: fixed; inset: 0; background: var(--night); opacity: 0; pointer-events: none; transition: opacity .35s ease; z-index: 5; }
#fade.on { opacity: 1; }

/* ---- UI layer ---- */
#ui {
  position: absolute; inset: 0; z-index: 10; pointer-events: none;
  display: flex; flex-direction: column;
  padding-bottom: var(--kb);
}
#ui > * { pointer-events: auto; }

#hud {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding-block: 10px 0; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
}
.nameplate { display: grid; gap: 1px; min-width: 0; text-shadow: 0 1px 12px rgba(0,0,0,.55); }
.nameplate .name {
  display: flex; align-items: center; gap: 7px;
  font: 900 24px/1.1 var(--font-display); letter-spacing: .01em; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nameplate .name .ico { color: var(--lamp); filter: drop-shadow(0 0 6px rgba(255,180,94,.6)); }
.mood { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); padding-left: 2px; }
.mood i { width: 8px; height: 8px; border-radius: 50%; background: var(--moon); box-shadow: 0 0 8px currentColor; color: var(--moon); }
.mood[data-mood="happy"] i, .mood[data-mood="excited"] i { background: var(--lamp); color: var(--lamp); }
.mood[data-mood="shy"] i { background: var(--rose); color: var(--rose); }
.mood[data-mood="relaxed"] i { background: var(--mint); color: var(--mint); }
.mood[data-mood="angry"] i { background: var(--danger); color: var(--danger); }
.hud-right { display: flex; align-items: center; gap: 8px; }
.hud-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 20px; background: var(--glass);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  font-weight: 600; font-variant-numeric: tabular-nums;
}
.hud-btn.coin { color: var(--lamp); }
.hud-btn.coin span { color: var(--text); }
.heart-badge { padding: 0 12px 0 8px; }
.heart-badge svg.h { width: 26px; height: 26px; flex: none; overflow: visible; }
.heart-badge .lvl { display: grid; line-height: 1.05; text-align: left; }
.heart-badge .lvl b { font: 700 13px/1.1 var(--font-display); color: var(--text); white-space: nowrap; }
.heart-badge .lvl small { font-size: 11px; color: var(--rose); font-weight: 600; }
.heart-badge.pulse svg.h { animation: beat .6s ease; }
@keyframes beat { 30% { transform: scale(1.25); } 60% { transform: scale(.95); } }
.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; flex: none;
  border: 1px solid var(--line); border-radius: 50%; background: var(--glass); color: var(--text);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.icon-btn.small { width: 34px; height: 34px; background: transparent; }

#toasts {
  position: absolute; left: 50%; top: 66px; transform: translateX(-50%); z-index: 40;
  display: grid; gap: 6px; justify-items: center; pointer-events: none; width: min(92vw, 420px);
}
.toast {
  display: flex; align-items: center; gap: 8px; max-width: 100%;
  padding: 8px 14px; border-radius: 18px; background: rgba(22, 26, 53, .92); border: 1px solid var(--line);
  font-size: 13.5px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,.35);
  animation: toastIn .25s ease;
}
.toast .toast-ico { color: var(--lamp); display: grid; }
.toast.rose .toast-ico { color: var(--rose); }
.toast.out { opacity: 0; transform: translateY(-6px); transition: .3s; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } }

/* ---- chat ---- */
#chat {
  margin-top: auto; display: flex; flex-direction: column; gap: 8px;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 0 8px;
  position: relative;
}
#logWrap { position: relative; }
#log {
  display: flex; flex-direction: column; gap: 8px;
  max-height: min(31vh, 300px); overflow-y: auto; overscroll-behavior: contain;
  padding-top: 26px; scrollbar-width: none;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 30px);
  mask-image: linear-gradient(to bottom, transparent 0, #000 30px);
}
#log::-webkit-scrollbar { display: none; }
.chat-collapsed #log { display: none; }
#logToggle { position: absolute; right: 0; top: -38px; width: 32px; height: 32px; }
.chat-collapsed #logToggle { top: -40px; }
.msg { display: flex; flex-direction: column; max-width: min(84%, 520px); min-width: 0; }
.msg .who { display: none; font: 700 11.5px/1 var(--font-display); color: var(--lamp); margin: 0 0 4px 12px; letter-spacing: .04em; }
.msg.her { align-self: flex-start; }
.msg.her .bubble {
  position: relative; background: var(--paper); color: var(--paper-ink);
  border: 1.5px solid var(--paper-edge); border-radius: 18px 18px 18px 5px;
  padding: 8px 13px 9px; font-size: 15.5px; line-height: 1.38;
  box-shadow: 0 6px 18px rgba(4, 4, 16, .28);
  overflow-wrap: anywhere;
}
.msg.you { align-self: flex-end; }
.msg.you .bubble {
  background: rgba(30, 37, 78, .9); color: var(--text);
  border: 1px solid rgba(190, 211, 255, .3); border-radius: 18px 18px 5px 18px;
  padding: 8px 13px 9px; font-size: 15px; overflow-wrap: anywhere;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.msg.system { align-self: center; max-width: 100%; }
.msg.system .bubble { font-size: 12.5px; color: var(--muted); background: rgba(12,15,34,.6); border-radius: 12px; padding: 4px 10px; }
.msg.history { opacity: .6; }
.divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.dots { display: inline-flex; align-items: center; gap: 4px; height: 20px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--paper-ink); opacity: .35; animation: dot 1.1s infinite ease-in-out; }
.dots i:nth-of-type(2) { animation-delay: .15s; } .dots i:nth-of-type(3) { animation-delay: .3s; }
.dots .think { font-size: 13px; color: var(--paper-ink); opacity: .7; margin-right: 4px; font-style: italic; }
@keyframes dot { 40% { opacity: 1; transform: translateY(-3px); } }
.card { background: rgba(22,26,53,.94); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; }
.card.crisis { border-color: rgba(143, 214, 190, .55); }
.card strong { display: block; font-family: var(--font-display); margin-bottom: 4px; color: var(--mint); }
.card p { margin: 0; color: var(--text); }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 2px; margin-inline: -2px; padding-inline: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px;
  border-radius: 18px; border: 1px solid var(--line); background: rgba(12, 15, 34, .7);
  font-size: 13.5px; font-weight: 500; white-space: nowrap;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
@media (hover: hover) { .chip:hover { border-color: rgba(255,180,94,.5); } }
.chip.action { background: rgba(255, 180, 94, .18); border-color: rgba(255, 180, 94, .55); color: #ffd9ab; }
.chip-ico { display: grid; color: var(--lamp); }

#composer { display: flex; align-items: center; gap: 8px; }
#msg {
  flex: 1; min-width: 0; height: 48px; padding: 0 16px; font-size: 16px;
  border-radius: 24px; border: 1px solid var(--line); background: rgba(10, 12, 28, .82); color: var(--text);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
#msg::placeholder { color: #8f8aa6; }
#msg:focus-visible { outline-offset: 0; border-color: var(--lamp); }
#voiceBtn { width: 44px; height: 44px; }
#voiceBtn[aria-pressed="false"] { color: var(--muted); }
#sendBtn {
  display: grid; place-items: center; width: 48px; height: 48px; flex: none; border: 0; border-radius: 50%;
  background: var(--lamp); color: var(--lamp-ink); box-shadow: 0 4px 18px rgba(255, 180, 94, .35);
}
#sendBtn.stop { background: var(--rose); box-shadow: 0 4px 18px rgba(255, 127, 152, .35); }

#dock {
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 4px 6px;
  background: linear-gradient(to top, rgba(9, 11, 26, .92) 55%, rgba(9, 11, 26, 0));
}
.dock-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: 54px; border: 0; background: none; color: var(--muted); border-radius: 14px; padding: 4px 0;
}
.dock-label { font-size: 11.5px; font-weight: 600; letter-spacing: .01em; }
.dock-btn.active { color: var(--lamp); }
@media (hover: hover) { .dock-btn:hover { color: var(--lamp); } }
.dock-btn.active .dock-ico { filter: drop-shadow(0 0 8px rgba(255,180,94,.55)); }
.typing #dock { display: none; }

/* ---- wide screens ---- */
#app.wide #ui {
  display: grid; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: auto minmax(0, 1fr) auto;
  column-gap: 16px;
}
#app.wide #hud { grid-column: 1 / -1; }
#app.wide #chat {
  grid-column: 2; grid-row: 2; margin: 14px var(--gutter-r) 0 0; padding: 14px 14px 12px;
  border-radius: 22px 22px 0 0; background: rgba(12, 15, 34, .72); border: 1px solid var(--line); border-bottom: 0;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); min-height: 0;
}
#app.wide #logWrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#app.wide #log { max-height: none; flex: 1; }
#app.wide .msg .who { display: block; }
#app.wide #log:empty::before { content: attr(data-empty); margin: auto; max-width: 26ch; text-align: center; color: var(--muted); font-size: 14px; }
#app.wide #logToggle { display: none; }
#app.wide .chips { flex-wrap: wrap; overflow: visible; }
#app.wide #dock {
  grid-column: 2; grid-row: 3; margin: 0 var(--gutter-r) 16px 0; padding: 4px 8px 8px;
  background: rgba(12, 15, 34, .72); border: 1px solid var(--line); border-top: 1px solid rgba(255,236,214,.08);
  border-radius: 0 0 22px 22px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
#app.wide.typing #dock { display: grid; }
#app.wide #toasts { left: calc((100% - 416px) / 2); }

/* ---- sheets ---- */
#sheetLayer { position: fixed; inset: 0; z-index: 30; }
.scrim { position: absolute; inset: 0; background: rgba(5, 6, 16, .45); opacity: 0; transition: opacity .25s; }
#sheetLayer.open .scrim { opacity: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 84%;
  display: flex; flex-direction: column;
  background: var(--panel); border-top: 1px solid var(--line); border-radius: 24px 24px 0 0;
  box-shadow: 0 -16px 40px rgba(0,0,0,.4);
  transform: translateY(102%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
#sheetLayer.open .sheet { transform: none; }
.sheet-grip { width: 42px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); margin: 8px auto 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px var(--gutter-r) 6px var(--gutter-l); }
.sheet-title { margin: 0; font: 900 21px/1.2 var(--font-display); text-wrap: balance; }
.sheet-close { background: transparent; }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 4px var(--gutter-r) 22px var(--gutter-l); display: grid; gap: 14px; align-content: start; }
.sheet-lead { margin: 0; color: var(--muted); font-size: 14px; }
.coins-inline { display: inline-flex; align-items: center; gap: 3px; color: var(--lamp); vertical-align: -3px; }
.empty { margin: 8px 0; padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }
#app.wide #sheetLayer .sheet {
  left: auto; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 16px; width: 420px; max-height: calc(100% - 96px);
  border-radius: 22px; border: 1px solid var(--line);
}

/* gifts */
.gift-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.gift {
  display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 10px; row-gap: 2px; align-items: center;
  text-align: left; padding: 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel-2);
}
.gift:disabled { opacity: .5; cursor: default; }
.gift:not(:disabled):hover { border-color: rgba(255,180,94,.5); }
.gift-swatch { grid-row: span 2; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: var(--hue); color: #1b1526; }
.gift.locked .gift-swatch { background: rgba(255,255,255,.08); color: var(--muted); }
.gift-name { font-weight: 600; font-size: 14px; line-height: 1.2; }
.gift-price { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--lamp); font-variant-numeric: tabular-nums; }
.gift.locked .gift-price { color: var(--muted); }

/* journal */
.tabs { display: flex; gap: 6px; padding: 4px; background: rgba(255,255,255,.04); border-radius: 14px; }
.tab { flex: 1; height: 36px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 600; }
.tab.on { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.tab-panel { display: grid; gap: 12px; }
.mem-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.mem-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 6px 8px 12px; border-radius: 12px; background: var(--panel-2); }
.mem-list li span { min-width: 0; overflow-wrap: anywhere; }
.moments { list-style: none; margin: 0; padding: 0 0 0 14px; display: grid; gap: 10px; border-left: 2px solid rgba(255,180,94,.3); }
.moment { display: grid; gap: 1px; position: relative; }
.moment::before { content: ""; position: absolute; left: -20px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--lamp); box-shadow: 0 0 0 3px var(--panel); }
.moment[data-kind="level"]::before { background: var(--rose); }
.moment time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.us-level { display: flex; align-items: center; gap: 12px; }
.us-level strong { display: block; font: 900 20px/1.2 var(--font-display); }
.us-heart { color: var(--rose); }
.meter { height: 8px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
.meter span { display: block; height: 100%; width: calc(var(--p) * 100%); background: linear-gradient(90deg, var(--rose), var(--lamp)); border-radius: 4px; }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; margin: 0; font-variant-numeric: tabular-nums; }
.stats dt { color: var(--muted); }
.stats dd { margin: 0; font-weight: 700; text-align: right; }

/* settings */
.set-group { display: grid; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.set-group:last-child { border-bottom: 0; }
.set-group h3 { margin: 4px 0 0; font: 700 12px/1 var(--font-body); letter-spacing: .09em; text-transform: uppercase; color: var(--lamp); }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; flex-wrap: wrap; }
.set-label { display: grid; min-width: 0; flex: 1 1 140px; }
.set-label small { color: var(--muted); font-size: 12.5px; }
.set-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.set-status { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 13.5px; color: var(--muted); }
.set-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.set-status[data-online="true"] .dot { background: var(--mint); box-shadow: 0 0 8px var(--mint); }
.style-note { margin: 0; font-style: italic; color: var(--muted); font-size: 13.5px; }
.about { margin: 0; font-size: 13.5px; }
.switch { position: relative; width: 50px; height: 30px; flex: none; border-radius: 15px; border: 1px solid var(--line); background: rgba(255,255,255,.08); padding: 0; transition: background .2s; }
.switch span { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.switch[aria-checked="true"] { background: rgba(255,180,94,.35); border-color: rgba(255,180,94,.6); }
.switch[aria-checked="true"] span { transform: translateX(20px); background: var(--lamp); }
.range { width: min(220px, 100%); accent-color: var(--lamp); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg-btn { height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--line); background: transparent; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg-btn[aria-checked="true"] { background: rgba(255,180,94,.18); border-color: rgba(255,180,94,.6); color: #ffd9ab; }
.field { width: 100%; height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(5,6,16,.4); color: var(--text); font-size: 16px; }
select.field { width: min(260px, 100%); height: 40px; font-size: 14px; }
.field:focus-visible { outline-offset: 0; border-color: var(--lamp); }
.btn { height: 42px; padding: 0 18px; border-radius: 21px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 600; }
.btn.small { height: 36px; padding: 0 14px; font-size: 13.5px; }
.btn.primary { background: var(--lamp); color: var(--lamp-ink); border-color: transparent; }
.btn.danger { color: var(--danger); border-color: rgba(255,143,128,.4); }

/* wardrobe, places, games (module stubs) */
.outfit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.outfit { display: grid; gap: 4px; justify-items: start; text-align: left; padding: 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel-2); }
.outfit.on { border-color: var(--lamp); }
.outfit:disabled { opacity: .5; cursor: default; }
.outfit-swatch { display: grid; place-items: center; width: 100%; height: 64px; border-radius: 10px; background: linear-gradient(160deg, var(--tee) 60%, #1b1b22 60%); color: #1b1526; }
.outfit small { color: var(--muted); font-size: 12px; }
.place-list { display: grid; gap: 8px; }
.place { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel-2); }
.place:disabled { cursor: default; }
.place.locked { opacity: .55; }
.place.here { border-color: rgba(255,180,94,.5); }
.place-ico { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: rgba(190,211,255,.12); color: var(--moon); flex: none; }
.place-text { display: grid; flex: 1; min-width: 0; }
.place-text small { color: var(--muted); }
.place-tag { font-size: 12px; color: var(--lamp); font-weight: 700; }
.rps-score { display: flex; justify-content: center; gap: 28px; font: 700 15px var(--font-display); color: var(--muted); }
.rps-score b { color: var(--text); font-size: 22px; margin-left: 4px; font-variant-numeric: tabular-nums; }
.rps-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.rps-btn { display: grid; justify-items: center; gap: 6px; padding: 16px 6px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 600; }
.rps-btn:hover { border-color: rgba(255,180,94,.5); color: #ffd9ab; }
.rps-status { text-align: center; min-height: 2.9em; }

/* ---- dialogs ---- */
#dialogLayer { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.dialog-wrap { position: absolute; inset: 0; display: grid; place-items: center; padding-left: var(--gutter-l); padding-right: var(--gutter-r); pointer-events: auto; }
.dialog-wrap .scrim { opacity: 1; }
.dialog { position: relative; width: min(100%, 360px); display: grid; gap: 12px; padding: 20px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.dialog h3 { margin: 0; font: 900 19px/1.25 var(--font-display); text-wrap: balance; }
.dialog p { margin: 0; color: var(--muted); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

/* ---- onboarding ---- */
#onboard { position: fixed; inset: 0; z-index: 45; display: flex; align-items: flex-end; justify-content: center; }
#onboard.out { opacity: 0; transition: opacity .3s; }
.ob-scrim { position: absolute; inset: 0; background: linear-gradient(to top, rgba(6,7,18,.9) 30%, rgba(6,7,18,.15) 75%, rgba(6,7,18,0)); }
.ob-card {
  position: relative; width: min(100%, 460px); max-height: 88%; overflow-y: auto;
  margin-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  margin-left: var(--gutter-l); margin-right: var(--gutter-r);
  padding: 20px; border-radius: 24px; background: rgba(22, 26, 53, .96); border: 1px solid var(--line);
  box-shadow: 0 24px 60px rgba(0,0,0,.5); display: grid; gap: 12px;
}
.ob-form { display: grid; gap: 12px; }
.ob-kicker { margin: 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--lamp); font-weight: 700; }
.ob-card h2 { margin: -6px 0 0; font: 900 25px/1.2 var(--font-display); text-wrap: balance; }
.ob-text, .ob-note { margin: 0; color: var(--muted); font-size: 14px; }
.ob-note { font-size: 12.5px; border-left: 2px solid rgba(190,211,255,.35); padding-left: 10px; }
.ob-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 2px; }
.ob-styles { display: grid; gap: 6px; }
.ob-style { display: grid; gap: 1px; text-align: left; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel-2); }
.ob-style strong { font: 700 15px var(--font-display); }
.ob-style span { font-size: 13px; color: var(--muted); }
.ob-style em { display: none; font-size: 13px; color: #e8dccb; }
.ob-style[aria-checked="true"] em { display: block; }
.ob-style[aria-checked="true"] { border-color: var(--lamp); background: rgba(255,180,94,.12); }
.ob-steps { display: flex; justify-content: center; gap: 6px; }
.ob-steps i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); transition: width .2s; }
.ob-steps i.on { width: 18px; background: var(--lamp); }

/* ---- loading ---- */
#loading {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; text-align: center;
  background: radial-gradient(120% 80% at 70% 18%, #1d2550 0%, #0c0f22 55%, #07091a 100%);
  transition: opacity .6s ease;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
}
#loading.done { opacity: 0; pointer-events: none; }
.load-inner { display: grid; justify-items: center; gap: 14px; width: min(100%, 340px); }
.load-moon { width: 74px; height: 74px; border-radius: 50%; position: relative;
  background: radial-gradient(circle at 35% 35%, #fff6dc 0 55%, #f2deb0 100%); box-shadow: 0 0 40px rgba(255, 238, 200, .45), 0 0 120px rgba(255, 200, 140, .2); }
.load-moon::after { content: ""; position: absolute; inset: -2px -2px -2px 22px; border-radius: 50%; background: radial-gradient(120% 80% at 70% 18%, #1d2550 0%, #141a3c 100%); transform: translateX(14px); opacity: .92; }
.load-title { margin: 6px 0 0; font: 900 34px/1.1 var(--font-display); letter-spacing: .01em; text-wrap: balance; }
.load-sub { margin: -6px 0 6px; color: var(--muted); font-size: 14px; }
.load-bar { --p: 0; position: relative; width: 100%; height: 22px; }
.load-bar::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 2px; border-radius: 1px; background: rgba(255,255,255,.12); }
.load-bar::after { content: ""; position: absolute; left: 0; top: 10px; height: 2px; width: calc(var(--p) * 100%); border-radius: 1px; background: var(--lamp); box-shadow: 0 0 10px var(--lamp); transition: width .25s; }
.load-bulbs { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; }
.load-bulbs i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.18); transition: background .3s, box-shadow .3s; }
.load-bulbs i.on { background: #ffd27a; box-shadow: 0 0 10px #ffb45e, 0 0 22px rgba(255,180,94,.5); }
#loadLabel { margin: 0; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.4em; }

/* ---- motion preferences ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }

@media (max-width: 360px) {
  .heart-badge .lvl { display: none; }
  .nameplate .name { font-size: 21px; }
  .dock-label { font-size: 10.5px; }
}
</style>

<div id="app">
  <canvas id="scene" aria-label="Mira in her room. Tap her head for a pat, her cheek for a poke, her hand to hold it, or her shoulder to get her attention. Drag to look around, pinch to zoom."></canvas>
  <div id="fade"></div>

  <div id="ui">
    <header id="hud">
      <div class="nameplate">
        <span class="name"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg><span id="herName">Mira</span></span>
        <span class="mood" id="mood" data-mood="neutral"><i></i><span id="moodText">content</span></span>
      </div>
      <div class="hud-right">
        <button id="coinBtn" class="hud-btn coin" type="button" aria-label="Coins. Open gifts">
          <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m12 7.8 1.2 2.6 2.8.3-2.1 1.9.6 2.8L12 14l-2.5 1.4.6-2.8L8 10.7l2.8-.3z"/></svg>
          <span id="coinCount">0</span>
        </button>
        <button id="heartBtn" class="hud-btn heart-badge" type="button" aria-label="Affection. Open journal">
          <svg class="h" viewBox="0 0 24 24" aria-hidden="true">
            <defs><clipPath id="heartClip"><path d="M12 20.3s-7.8-4.6-7.8-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.8 2.5c0 5.6-7.8 10.2-7.8 10.2z"/></clipPath></defs>
            <rect id="heartFill" x="0" y="24" width="24" height="24" fill="var(--rose)" clip-path="url(#heartClip)"/>
            <path d="M12 20.3s-7.8-4.6-7.8-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.8 2.5c0 5.6-7.8 10.2-7.8 10.2z" fill="none" stroke="var(--rose)" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          <span class="lvl"><b id="levelName">Just met</b><small id="levelNum">Lv 0</small></span>
        </button>
        <button id="camBtn" class="icon-btn" type="button" aria-label="Change camera framing">
          <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5h3l1.6-2.5h6.8L17 8.5h3v10H4z"/><circle cx="12" cy="13.2" r="3.3"/></svg>
        </button>
      </div>
    </header>
    <div id="toasts" aria-live="polite"></div>

    <section id="chat" aria-label="Chat">
      <div id="logWrap">
        <button id="logToggle" class="icon-btn" type="button" aria-label="Show or hide chat" aria-expanded="true" aria-controls="log">
          <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div id="log" role="log" aria-live="polite" aria-label="Conversation" data-empty="Say hi. She remembers what you tell her."></div>
      </div>
      <div id="chips" class="chips" aria-label="Quick replies"></div>
      <form id="composer" autocomplete="off">
        <button id="voiceBtn" class="icon-btn" type="button" aria-pressed="true" aria-label="Voice on"></button>
        <input id="msg" name="msg" type="text" aria-label="Message" maxlength="500" placeholder="Say something to Mira…" autocomplete="off" enterkeyhint="send">
        <button id="sendBtn" type="submit" aria-label="Send">
          <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12 20 4l-4.5 16-3.2-6.8z"/><path d="M12.3 13.2 20 4"/></svg>
        </button>
      </form>
    </section>
    <nav id="dock" aria-label="Menu"></nav>
  </div>

  <div id="onboard" hidden></div>
  <div id="sheetLayer" hidden></div>
  <div id="dialogLayer"></div>

  <div id="loading" role="status" aria-live="polite">
    <div class="load-inner">
      <div class="load-moon" aria-hidden="true"></div>
      <h1 class="load-title">Mira's Room</h1>
      <p class="load-sub">The lamp is on. She is almost ready.</p>
      <div class="load-bar" id="loadBar" aria-hidden="true"><div class="load-bulbs"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      <p id="loadLabel">Loading…</p>
    </div>
  </div>
</div>
